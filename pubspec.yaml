name: ipsum_user
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.2+7

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg:
  table_calendar: ^3.0.9
  google_fonts:
  file_picker:
  dio:
  url_launcher:
  path_provider:
  printing:
  syncfusion_flutter_pdfviewer:
  bloc: ^9.2.0
  equatable: ^2.0.5
  flutter_secure_storage:
  shared_preferences: ^2.3.0
  flutter_bloc:
  fluttertoast:
  json_annotation:
  get_it: ^9.0.5
  share_plus: ^12.0.1
  file_saver: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner:
  json_serializable:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.jpg"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icon/logo_bg.png

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700